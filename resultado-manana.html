<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pronóstico de Mañana - CIMHA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/resultado-manana.css" />
</head>

<body>
    <main class="forecast-page">
        <div class="page-content">
            <header class="header-container">
                <div class="header-top">
                    <div class="header-icon">
                        <svg class="w-6 h-6 text-blue-600" fill="currentColor" viewBox="0 0 20 20"
                            xmlns="http://www.w3.org/2000/svg">
                            <path clip-rule="evenodd"
                                d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z"
                                fill-rule="evenodd"></path>
                        </svg>
                    </div>
                    <h1 id="ubicacion" class="header-title">Cargando ubicación...</h1>
                </div>

                <div class="header-meta">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
                            stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                    <span id="fecha" class="text-slate-500 text-sm">--</span>
                    <span class="header-meta-separator">&middot;</span>
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round"
                            stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                    <span id="hora" class="text-slate-500 text-sm">--:--</span>
                </div>
            </header>

            <section class="weather-gradient">
                <div class="weather-top">
                    <p id="estado-cielo" class="weather-sky">Cargando información...</p>
                </div>

                <div class="weather-stats-card">
                    <div class="weather-stat">
                        <div class="stat-icon bg-red">
                            <img src="assets/icon-temp-max.png" alt="Temperatura Máxima" class="icon-temp-max" />
                        </div>
                        <span class="stat-label">Temperatura Maxima</span>
                        <span id="temp-max" class="stat-value">--°</span>
                    </div>

                    <div class="weather-divider"></div>

                    <div class="weather-stat">
                        <div class="stat-icon bg-blue">
                            <img src="assets/icon-temp-min.png" alt="Temperatura Mínima" class="icon-temp-min" />
                        </div>
                        <span class="stat-label">Temperatura<br />Minima</span>
                        <span id="temp-min" class="stat-value">--°</span>
                    </div>

                    <div class="weather-divider"></div>

                    <div class="weather-stat">
                        <div class="stat-icon bg-indigo">
                            <img src="assets/icon-sensacion-termica.png" alt="Sensación Térmica"
                                class="icon-sensacion-termica" />
                        </div>
                        <span class="stat-label">Sensación Térmica</span>
                        <span id="sensacion-termica" class="stat-value">--°</span>
                    </div>
                </div>
            </section>

            <section class="detailed-data">
                <div class="detail-item">
                    <div class="detail-icon">
                        <img src="assets/icon-probailidad-lluvia.png" alt="Probabilidad de Lluvia"
                            class="icon-prob-lluvia" />
                    </div>
                    <span class="detail-label">Probabilidad de Lluvia</span>
                    <span id="prob-lluvia" class="detail-value">--%</span>
                </div>

                <div class="detail-divider"></div>

                <div class="detail-item">
                    <div class="detail-icon">
                        <img src="assets/icon-viento.png" alt="Viento" class="icon-viento" />
                    </div>
                    <span class="detail-label">Viento</span>
                    <span id="velocidad-viento" class="detail-value">-- Km/h</span>
                </div>
            </section>

            <section class="interpretation-card">
                <div class="card-heading">
                    <img src="assets/icon-comentario.png" alt="Interpretación" />
                    <h2>Interpretación</h2>
                </div>
                <p id="interpretacion">Cargando interpretación...</p>
            </section>

            <section class="stations-card">
                <div class="stations-heading">
                    <h2>Estaciones del Río Sinú</h2>
                    <p>Pronóstico hidrológico de mañana</p>
                </div>
                <div id="contenedor-estaciones" class="stations-list">
                    <p class="empty-state">Cargando estaciones...</p>
                </div>
            </section>

            <button type="button" id="salir-pronostico" class="exit-button">Salir del pronóstico</button>
        </div>
    </main>

    <script src="js/resultado-manana.js"></script>
</body>

</html>
