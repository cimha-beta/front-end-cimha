<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Consulta Territorial</title>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Fuentes Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet" />

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="css/consulta-geografica.css" />
    <link rel="stylesheet" href="css/tailwind.css" />
</head>
<body>
    <main>

        <!-- Logo -->
        <img class="logo" alt="Consulta Geográfica Logo" src="assets/consulta-logo.png" />

        <!-- Encabezado -->
        <header class="header">
            <h1>Consulta Geográfica</h1>
            <p>Seleccione el departamento y municipio para realizar la consulta</p>
        </header>

        <!-- Formulario -->
        <div class="form">

            <!-- Departamento -->
            <div class="field">
                <label>Departamento</label>
                <button class="trigger" id="dept-trigger" type="button">
                    <span id="dept-label">Selecciona un departamento</span>
                    <span class="material-symbols-outlined" id="dept-icon">expand_more</span>
                </button>
                <ul class="dropdown" id="dept-list"></ul>
            </div>

            <!-- Municipio -->
            <div class="field">
                <label>Municipio</label>
                <button class="trigger" id="muni-trigger" type="button" disabled>
                    <span id="muni-label">Selecciona un municipio</span>
                    <span class="material-symbols-outlined" id="muni-icon">expand_more</span>
                </button>
                <ul class="dropdown" id="muni-list"></ul>
            </div>

            <!-- Botón consultar -->
            <button class="submit" id="submit-btn" type="button" disabled>Consultar</button>

        </div>
    </main>

    <!-- JavaScript -->
    <script src="js/consulta-geografica.js"></script>
</body>
</html>
