<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Resultado - Lorica, Cordoba</title>
    
    <!-- ✅ Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    
    <!-- ✅ Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- ✅ CSS Personalizado -->
    <link rel="stylesheet" href="css/weather-dashboard.css" />
</head>
<body>
    <!-- ============================================ -->
    <!-- MAIN CONTAINER                              -->
    <!-- ============================================ -->
    <main class="main-container relative bg-white overflow-hidden rounded-[3rem] p-6 space-y-6">
        
        <!-- ============================================ -->
        <!-- HEADER SECTION                              -->
        <!-- ============================================ -->
        <header class="flex justify-between items-start">
            <div class="flex items-center space-x-3">
                <!-- Calendar Icon -->
                <div class="w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center shadow-sm">
                    <svg class="h-6 w-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                </div>
                <div>
                    <h2 class="text-[#0f172a] font-bold text-lg leading-tight">Domingo 14 de<br />Junio 2026</h2>
                </div>
            </div>
            <!-- Time Pill -->
            <div class="bg-blue-50 px-4 py-2 rounded-full flex items-center space-x-2 shadow-sm border border-blue-100">
                <svg class="h-5 w-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                </svg>
                <span class="text-blue-900 font-semibold text-sm">05:35 p.m</span>
            </div>
        </header>
        
        <!-- Location Display -->
        <div class="flex items-center space-x-2 px-1">
            <svg class="h-5 w-5 text-blue-600" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"></path>
            </svg>
            <span class="text-gray-500 font-medium">Lorica, Cordoba</span>
        </div>
        
        <!-- ============================================ -->
        <!-- HERO CARD - CURRENT WEATHER                  -->
        <!-- ============================================ -->
        <section class="weather-gradient rounded-[2.5rem] p-6 text-white relative shadow-xl overflow-hidden">
            <div class="relative z-10 flex flex-col">
                <div class="flex items-baseline justify-between">
                    <div>
                        <h1 class="text-[6rem] font-bold tracking-tighter leading-none">31°</h1>
                        <p class="text-lg font-medium mt-1">Parcialmente Soleado</p>
                    </div>
                </div>
                <!-- Temp Range Mini-Card -->
                <div class="mt-6 glass-card rounded-3xl p-4 flex justify-between items-center shadow-lg">
                    <!-- Max Temp -->
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center shadow-inner">
                            <svg class="h-5 w-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M5 10l7-7m0 0l7 7m-7-7v18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                            </svg>
                        </div>
                        <div>
                            <p class="text-sm text-blue-900 uppercase font-bold tracking-wider opacity-60">Max</p>
                            <p class="text-3xl font-bold text-blue-900">31°</p>
                        </div>
                    </div>
                    <div class="w-px bg-blue-300 opacity-30 h-14"></div>
                    <!-- Min Temp -->
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center shadow-inner">
                            <svg class="h-5 w-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M19 14l-7 7m0 0l-7-7m7 7V3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                            </svg>
                        </div>
                        <div>
                            <p class="text-sm text-blue-900 uppercase font-bold tracking-wider opacity-60">Min</p>
                            <p class="text-3xl font-bold text-blue-900">21°</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        
        <!-- ============================================ -->
        <!-- STATS GRID                                   -->
        <!-- ============================================ -->
        <section class="flex flex-col gap-4">
            <!-- Card 1: Probabilidad de Lluvia -->
            <div class="bg-white rounded-[2.5rem] p-6 shadow-sm border border-gray-50 flex items-center space-x-4">
                <div class="w-14 h-14 bg-blue-50 rounded-full flex items-center justify-center shrink-0">
                    <svg class="h-6 w-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M19 16.2A5 5 0 0018 7h-1.26a8 8 0 10-11.62 9" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                        <path d="M8 19l2 2m4-2l2 2m-4-2v2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                </div>
                <div class="flex flex-col">
                    <p class="text-sm text-gray-800 font-medium">Probabilidad de Lluvia</p>
                    <p class="text-2xl font-bold text-blue-600">20%</p>
                </div>
            </div>
            
            <!-- Card 2: Viento -->
            <div class="bg-white rounded-[2.5rem] p-6 shadow-sm border border-gray-50 flex items-center space-x-4">
                <div class="w-14 h-14 bg-blue-50 rounded-full flex items-center justify-center shrink-0">
                    <svg class="h-6 w-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                </div>
                <div class="flex flex-col">
                    <p class="text-sm text-gray-800 font-medium">Viento</p>
                    <p class="text-2xl font-bold text-blue-600">5.5 Km/h</p>
                </div>
            </div>
        </section>
        
        <!-- ============================================ -->
        <!-- ALERTS LIST                                  -->
        <!-- ============================================ -->
        <section class="bg-white rounded-[2.5rem] p-4 shadow-sm border border-gray-50">
            <div class="divide-y divide-gray-100">
                
                <!-- Alert Item 1 -->
                <div class="flex items-center justify-between p-4 hover:bg-gray-50 transition-colors cursor-pointer group alert-item">
                    <div class="flex items-center space-x-4">
                        <div class="w-14 h-14 bg-red-50 rounded-2xl flex items-center justify-center shadow-sm">
                            <svg class="h-7 w-7 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                            </svg>
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-900">Temperaturas Altas</h3>
                            <p class="text-sm text-gray-400">Alerta Meteorologica Actual</p>
                        </div>
                    </div>
                    <svg class="h-6 w-6 text-orange-400 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                </div>
                
                <!-- Alert Item 2 -->
                <div class="flex items-center justify-between p-4 hover:bg-gray-50 transition-colors cursor-pointer group alert-item">
                    <div class="flex items-center space-x-4">
                        <div class="w-14 h-14 bg-orange-50 rounded-2xl flex items-center justify-center shadow-sm">
                            <svg class="h-7 w-7 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                            </svg>
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-900">Fenomeno del Niño</h3>
                            <p class="text-sm text-gray-400">Evento Climatico Actual</p>
                        </div>
                    </div>
                    <svg class="h-6 w-6 text-orange-400 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                </div>
                
                <!-- Alert Item 3 -->
                <div class="flex items-center justify-between p-4 hover:bg-gray-50 transition-colors cursor-pointer group alert-item">
                    <div class="flex items-center space-x-4">
                        <div class="w-14 h-14 bg-purple-50 rounded-2xl flex items-center justify-center shadow-sm">
                            <svg class="h-7 w-7 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                            </svg>
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-900">Verano</h3>
                            <p class="text-sm text-gray-400">Estación Del Clima</p>
                        </div>
                    </div>
                    <svg class="h-6 w-6 text-purple-400 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                </div>
                
            </div>
        </section>
        
    </main>

    <!-- ✅ JavaScript -->
    <script src="js/resultado.js"></script>
</body>
</html>
