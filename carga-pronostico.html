<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Generando Pronóstico</title>

    <!-- Fuentes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="css/carga-pronostico.css" />
</head>
<body>
    <main>

        <!-- Encabezado -->
        <header class="head">
            <h1>Generando Pronóstico</h1>
            <p>Este proceso puede tardar unos minutos.</p>
        </header>

        <!-- Progreso -->
        <section class="progress">
            <div class="ring">
                <svg viewBox="0 0 140 140">
                    <circle class="ring-bg" cx="70" cy="70" r="60"></circle>
                    <circle class="ring-bar" id="ring-bar" cx="70" cy="70" r="60"></circle>
                </svg>
                <div class="ring-center">
                    <div class="odometer-wrap">
                        <div class="odometer" id="odometer"></div>
                        <div class="percent-sign">%</div>
                    </div>
                    <span class="ring-sub">completado</span>
                </div>
            </div>

            <!-- Paso actual -->
            <div class="step-info" id="step-info">
                <span class="step-count" id="step-count"></span>
                <strong class="step-name" id="step-name"></strong>
            </div>
        </section>

        <!-- Lista de pasos -->
        <div class="steps" id="steps-list">
            <span class="step-highlight" id="step-highlight"></span>
        </div>

        <!-- Botón cancelar -->
        <button class="cancel" id="cancel-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 18L18 6M6 6l12 12"></path>
            </svg>
            Cancelar
        </button>
    </main>

    <!-- Modal de cancelación -->
    <div class="modal hidden" id="cancel-modal">
        <div class="modal-content">
            <div class="modal-icon">
                <video id="cancel-video" autoplay muted playsinline src="assets/video_icono_cancelacion.mp4"></video>
            </div>
            <h2>Consulta cancelada</h2>
            <p>Detuvimos la generación de tu pronóstico. Te llevaremos a la pantalla principal.</p>
            <button class="modal-btn" id="modal-ok-btn" type="button">Volver al inicio</button>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/carga-pronostico.js"></script>
</body>
</html>
